# Checks every push to master and every pull request against the standards the
# plugin must meet on WordPress.org. Keep this green: master is what gets deployed.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './dist/*' -print0 \
            | xargs -0 -n 1 -P 4 php -l > /tmp/php-lint.log || { grep -v '^No syntax errors' /tmp/php-lint.log; exit 1; }

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer, cs2pr
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS (WordPress-Extra + WordPress-Docs + PHPCompatibilityWP)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist -q --report-full --report-checkstyle=./phpcs-report.xml
      - name: Annotate the pull request
        if: ${{ always() && hashFiles('phpcs-report.xml') != '' }}
        run: cs2pr ./phpcs-report.xml --graceful-warnings

  js:
    name: JavaScript lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint (eslint-config-wordpress)
        run: npm run lint
      - name: Production build
        run: npm run build

  metadata:
    name: Release metadata and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version, requirements and changelog agree
        run: bash scripts/check-versions.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli
      - name: Install gettext
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext
      - name: POT is up to date
        run: |
          cp languages/brain-2fa.pot /tmp/committed-raw.pot
          # Same command and exclusions as a local `npm run make-pot` (package.json).
          npm run make-pot --silent
          # Compare the translatable strings only. Headers, flags (e.g. "#, php-format"), source
          # references and ordering vary with the WP-CLI version, so they are ignored.
          strings() { msgcat --no-location --sort-output --no-wrap "$1" | grep -E '^(msgctxt|msgid|msgid_plural) '; }
          strings /tmp/committed-raw.pot > /tmp/committed.pot
          strings languages/brain-2fa.pot > /tmp/generated.pot
          if ! diff -u /tmp/committed.pot /tmp/generated.pot; then
            echo "::error file=languages/brain-2fa.pot::The POT file is out of date. Run npm run make-pot and commit languages/brain-2fa.pot."
            exit 1
          fi

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    needs: [php-syntax, phpcs, js]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the production package (dist/brain-2fa)
        run: |
          npm ci
          npm run build
          npm run package
      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/brain-2fa
